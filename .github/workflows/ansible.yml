name: "Ansible Pipeline"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

env:
  ANSIBLE_HOST_KEY_CHECKING: false
  ANSIBLE_FORCE_COLOR: true

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ansible
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Ansible
        run: pip install ansible ansible-lint

      - name: Install Galaxy roles
        run: ansible-galaxy role install -r requirements.yml -p roles/galaxy

      - name: Lint
        run: ansible-lint playbooks/ roles/

      - name: Syntax check site
        run: ansible-playbook playbooks/site.yml --syntax-check

      - name: Syntax check destroy
        run: ansible-playbook playbooks/destroy-k3s.yml --syntax-check

      - name: Syntax check immich
        run: ansible-playbook playbooks/immich.yml --syntax-check
