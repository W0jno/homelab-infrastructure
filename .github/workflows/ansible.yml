name: "Ansible Pipeline"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

env:
  ANSIBLE_HOST_KEY_CHECKING: false
  ANSIBLE_FORCE_COLOR: true

jobs:
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible ansible-lint

      - name: Install Galaxy roles
        run: ansible-galaxy role install -r requirements.yml -p roles/galaxy

      - name: Lint
        run: ansible-lint playbooks/ roles/

      - name: Syntax check site
        run: ansible-playbook playbooks/site.yml --syntax-check

      - name: Syntax check destroy
        run: ansible-playbook playbooks/destroy-k3s.yml --syntax-check

      - name: Syntax check media
        run: ansible-playbook playbooks/media.yml --syntax-check
