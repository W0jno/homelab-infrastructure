name: "Security Scan"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 6 * * 1" # weekly: new misconfiguration rules land without code changes

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
  ZIZMOR_VERSION: "1.30.1"

jobs:
  gitleaks:
    name: "Secrets in git history"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # scan every commit, not just the tip
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz

      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  trivy:
    name: "IaC misconfiguration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install trivy
        run: |
          curl -sSLo trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
          rm trivy.tar.gz

      - name: Scan Terraform, Kubernetes and Helm values
        run: '"$RUNNER_TEMP/trivy" config --exit-code 1 --severity HIGH,CRITICAL .'

  zizmor:
    name: "GitHub Actions audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Audit workflows
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github .github/workflows/
        env:
          GH_TOKEN: ${{ github.token }}
