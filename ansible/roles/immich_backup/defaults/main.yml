# Off-site backup of the Immich library to Backblaze B2 with restic (S3-compatible API).
# Set the bucket and endpoint in ansible/inventory/group_vars/immich.yml.
immich_backup_bucket: ""
immich_backup_s3_endpoint: "" # e.g. s3.eu-central-003.backblazeb2.com (bucket page in B2)
immich_backup_repo_path: immich
immich_backup_repository: "s3:https://{{ immich_backup_s3_endpoint }}/{{ immich_backup_bucket }}/{{ immich_backup_repo_path }}"

# Originals, profile pictures and Immich's own nightly DB dumps (backups/).
# thumbs/ and encoded-video/ are regenerated by Immich, so they are not uploaded.
immich_backup_paths:
  - "{{ immich_upload_location }}"
immich_backup_excludes:
  - "{{ immich_upload_location }}/thumbs"
  - "{{ immich_upload_location }}/encoded-video"

immich_backup_keep_daily: 7
immich_backup_keep_weekly: 4
immich_backup_keep_monthly: 12

# Host clock is UTC. Immich dumps its DB at 02:00 Europe/Warsaw, so this runs after it.
immich_backup_on_calendar: "*-*-* 03:30:00"
immich_backup_check_on_calendar: "Sun *-*-* 05:00:00"
immich_backup_check_subset: 5%

immich_backup_config_dir: /etc/restic

# Secrets live on the control node in ansible/credentials/ (gitignored), never in git.
immich_backup_credentials_dir: "{{ playbook_dir }}/../credentials"
immich_backup_key_id_file: "{{ immich_backup_credentials_dir }}/b2_immich_key_id"
immich_backup_app_key_file: "{{ immich_backup_credentials_dir }}/b2_immich_app_key"
# Generated once; without it the backup cannot be decrypted, keep a copy outside the lab.
immich_backup_restic_password: >-
  {{ lookup('ansible.builtin.password',
  immich_backup_credentials_dir ~ '/restic_immich_password',
  length=48, chars=['ascii_letters', 'digits']) }}
