- name: Ensure k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Read installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_master_installed
  changed_when: false
  failed_when: false

# Runs when k3s is missing or differs from k3s_version, so bumping the version upgrades in place.
- name: Install or upgrade k3s server
  ansible.builtin.command: /usr/local/src/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_version not in (k3s_master_installed.stdout | default(''))
  changed_when: true

- name: Apply k3s config before continuing
  ansible.builtin.meta: flush_handlers

- name: Ensure k3s server is running
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Wait for k3s kubeconfig
  ansible.builtin.wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: "{{ k3s_timeout }}"

- name: Wait for k3s node token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: "{{ k3s_timeout }}"

- name: Read k3s kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_master_kubeconfig_b64

- name: Read k3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_master_node_token_b64

- name: Expose node token for worker join
  ansible.builtin.set_fact:
    k3s_master_node_token: "{{ k3s_master_node_token_b64.content | b64decode | trim }}"

- name: Ensure local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write kubeconfig to Ansible controller
  ansible.builtin.copy:
    dest: "{{ k3s_kubeconfig_local_path }}"
    content: >-
      {{ k3s_master_kubeconfig_b64.content | b64decode
         | replace('https://127.0.0.1:', 'https://' ~ inventory_hostname ~ ':')
         | replace('https://localhost:', 'https://' ~ inventory_hostname ~ ':') }}
    mode: "0600"
  delegate_to: localhost
  become: false

# Disabling a component only stops k3s from deploying it; deleting the HelmChart
# makes helm-controller uninstall what an earlier install already deployed.
- name: Remove disabled packaged components
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl -n kube-system delete helmchart
    {{ item }} {{ item }}-crd --ignore-not-found
  loop: "{{ k3s_master_disable_components }}"
  register: k3s_master_disabled
  changed_when: "'deleted' in k3s_master_disabled.stdout"
