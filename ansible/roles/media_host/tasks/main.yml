- name: Ensure media directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_host_puid }}"
    group: "{{ media_host_pgid }}"
    mode: "0755"
  loop:
    - /opt/media
    - /opt/media/config/jellyfin
    - /opt/media/cache/jellyfin
    - /opt/media/config/qbittorrent
    - /opt/media/config/sonarr
    - /opt/media/config/prowlarr
    - /opt/media/config/bazarr
    - /mnt/media/downloads
    - /mnt/media/tv

- name: Copy docker compose
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../media/docker-compose.yml"
    dest: /opt/media/docker-compose.yml
    mode: "0644"

- name: Start media stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/media
  register: media_host_compose
  changed_when: >-
    media_host_compose.stdout is search('Started|Created|Recreated|Removed')
  failed_when: media_host_compose.rc != 0
